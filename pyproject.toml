[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "billtrace"
version = "0.1.0"
description = "Usage invoicing and explainable payment reconciliation for small services."
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "httpx>=0.28,<1", "ruff>=0.9,<1", "mypy>=1.14,<2", "hypothesis>=6,<7", "pip-audit>=2.9,<3"]

[project.scripts]
billtrace = "billtrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
billtrace = ["schema.sql"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"src/billtrace/api.py" = ["B008"]
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=billtrace --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
omit = ["src/billtrace/cli.py"]
